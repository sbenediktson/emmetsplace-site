name: Update videos.json

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 6 AM UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch videos
        run: node fetch-videos.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Build site
        run: node build-site.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in videos.json slugs.json index.html sitemap.xml llms.txt episodes musicians writers; do
            if [ -e "$p" ]; then git add -A -- "$p"; fi
          done
          git diff --cached --quiet || git commit -m "chore: update videos.json and generated pages"
          git pull --rebase && git push
